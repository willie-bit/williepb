[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "williepb-backend"
version = "0.1.0"
description = "Family asset management backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "python-dateutil>=2.9",
    "typer>=0.12",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
market = ["pykrx>=1.0.45"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
williepb = "app.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
